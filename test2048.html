<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#f7eee1"><title>おふポメ2048 2048達成テスト</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#56483e;background:#f7eee1}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:flex;justify-content:center}main{width:min(100%,510px);padding:22px 16px 36px}h1{font-size:32px;margin:8px 0 3px}small,.hint{color:#89776a}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.scores{display:flex;gap:7px}.score{background:#b6a18c;color:white;border-radius:10px;padding:8px 12px;text-align:center;min-width:76px;font-size:12px}.score b{display:block;font-size:23px}.toolbar{display:flex;gap:8px;margin:16px 0}button{border:0;background:#a8876e;color:white;border-radius:10px;font-weight:700;padding:12px 15px;cursor:pointer;font-size:14px}button.secondary{background:#d6c4b1;color:#554639}.board{position:relative;background:#bca995;border-radius:14px;padding:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;touch-action:none;user-select:none;aspect-ratio:1}.tile{border-radius:8px;background:#d5c6b7;display:grid;place-items:center;font-weight:900;font-size:clamp(21px,7vw,36px);color:#665548;transition:background .1s}.tile[data-v="2"]{background:#eee3d6}.tile[data-v="4"]{background:#efdbc0}.tile[data-v="8"]{background:#efbc89;color:#fff}.tile[data-v="16"]{background:#efa36f;color:#fff}.tile[data-v="32"]{background:#ed8d70;color:#fff}.tile[data-v="64"]{background:#e8785c;color:#fff}.tile[data-v="128"]{background:#e5c86d;color:#fff;font-size:29px}.tile[data-v="256"]{background:#e1be59;color:#fff;font-size:29px}.tile[data-v="512"]{background:#d8b14e;color:#fff;font-size:29px}.tile[data-v="1024"],.tile[data-v="2048"]{background:#d4a947;color:#fff;font-size:24px}.tile[data-v="4096"],.tile[data-v="8192"]{background:#b9a0d4;color:white;font-size:23px}.overlay{position:absolute;inset:10px;border-radius:10px;background:#f7eee1dc;display:none;align-items:center;justify-content:center;flex-direction:column;gap:15px;text-align:center;padding:15px}.overlay.show{display:flex}.overlay strong{font-size:28px}.help{line-height:1.8;margin-top:20px;font-size:14px}.footer{font-size:12px;margin-top:18px;color:#89776a}.notice{min-height:24px;font-size:13px;color:#8b644b}.direction{display:grid;grid-template-columns:repeat(3,50px);gap:6px;justify-content:center;margin-top:14px}.direction button{padding:9px}.direction .up{grid-column:2}.direction .left{grid-column:1}.direction .down{grid-column:2}.direction .right{grid-column:3}.direction button{min-height:48px;touch-action:manipulation}.direction{grid-template-columns:repeat(3,64px)}
</style></head><body><main><div class="top"><div><h1>おふポメ2048</h1><small>2048達成テスト専用・通常版とは別データ</small></div><div class="scores"><div class="score">SCORE<b id="score">0</b></div><div class="score">BEST<b id="best">0</b></div></div></div><div class="toolbar"><button id="setup" class="secondary">1024×2を配置</button><button id="new">新しいゲーム</button><button id="undo" class="secondary">1手戻す</button><button id="sound" class="secondary">音 OFF</button></div><div class="notice" id="notice" aria-live="polite"></div><div id="board" class="board" aria-label="2048の盤面"></div><div id="direction" class="direction"><button class="up" data-dir="up">↑</button><button class="left" data-dir="left">←</button><button class="down" data-dir="down">↓</button><button class="right" data-dir="right">→</button></div><div class="help"><b>あそびかた</b><div>同じ数字を重ねて、2048を目指そう！ iPhone・iPadはスワイプまたは画面下の方向ボタン、PCは矢印キーでも操作できるよ。</div><div>進行状況とベストスコアは、このブラウザに自動保存されるよ。</div></div><div class="footer">テスト専用ページ。通常版のindex.htmlと保存データには触れません。</div></main><script>
(()=>{'use strict';const key='ofupome2048-test2048-v01',bestKey='ofupome2048-test2048-best';const $=id=>document.getElementById(id);let grid=Array(16).fill(0),score=0,best=0,previous=null,won=false,over=false,sound=false,audio=null;const store={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};best=Number(store.get(bestKey))||0;function save(){store.set(key,JSON.stringify({grid,score,won,over}));store.set(bestKey,String(best))}function random(){const empty=grid.map((v,i)=>v?null:i).filter(v=>v!==null);if(!empty.length)return false;grid[empty[Math.floor(Math.random()*empty.length)]]=Math.random()<.9?2:4;return true}function notice(s){$('notice').textContent=s}function draw(){const b=$('board');b.innerHTML='';grid.forEach(v=>{const d=document.createElement('div');d.className='tile';d.dataset.v=String(v);d.textContent=v||'';b.appendChild(d)});$('score').textContent=score;$('best').textContent=best;$('undo').disabled=!previous;let overlay;if(over||won){overlay=document.createElement('div');overlay.className='overlay show';const title=document.createElement('strong');title.textContent=over?'ゲームオーバー':'2048達成！';const btn=document.createElement('button');btn.textContent=over?'もう一度':'このまま続ける';btn.onclick=()=>{if(over)newGame(true);else{won=false;save();draw()}};overlay.append(title,btn);b.appendChild(overlay)}}function beep(){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=420;g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.08);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.08)}catch{}}function hasMove(){if(grid.includes(0))return true;for(let r=0;r<4;r++)for(let c=0;c<4;c++){const i=r*4+c;if(c<3&&grid[i]===grid[i+1]||r<3&&grid[i]===grid[i+4])return true}return false}function move(dir){if(over||won)return;const before=grid.slice(),oldScore=score;let merged=0;for(let line=0;line<4;line++){const indices=[];for(let k=0;k<4;k++){let r,c;if(dir==='left'){r=line;c=k}else if(dir==='right'){r=line;c=3-k}else if(dir==='up'){r=k;c=line}else{r=3-k;c=line}indices.push(r*4+c)}const vals=indices.map(i=>grid[i]).filter(Boolean),out=[];for(let i=0;i<vals.length;i++){if(i+1<vals.length&&vals[i]===vals[i+1]){const v=vals[i]*2;out.push(v);score+=v;merged++;i++}else out.push(vals[i])}indices.forEach((idx,k)=>grid[idx]=out[k]||0)}if(before.every((v,i)=>v===grid[i]))return;previous={grid:before,score:oldScore,won,over};random();if(score>best)best=score;if(grid.some(v=>v>=2048)&&!won){won=true;notice('やったね！ 2048達成！')}else notice(merged?`${merged}組を合成！`:'');over=!hasMove();beep();save();draw()}function newGame(confirmed=false){if(!confirmed&&grid.some(Boolean)&&!confirm('現在のゲームを最初からやり直す？'))return;grid=Array(16).fill(0);score=0;previous=null;won=false;over=false;random();random();notice('ゆっくり、いこう。');save();draw()}$('setup').onclick=()=>{grid=[1024,1024,4,0,8,16,0,0,2,4,8,0,0,0,0,0];score=0;previous=null;won=false;over=false;notice('左に1回スワイプして2048を作ろう！');save();draw()};$('new').onclick=()=>newGame();$('undo').onclick=()=>{if(!previous)return;({grid,score,won,over}=previous);previous=null;notice('1手戻したよ');save();draw()};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'音 ON':'音 OFF';beep()};document.querySelectorAll('[data-dir]').forEach(btn=>{btn.addEventListener('click',()=>move(btn.dataset.dir));});window.addEventListener('keydown',e=>{const d={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];if(d){e.preventDefault();move(d)}});let start=null;const b=$('board');b.addEventListener('pointerdown',e=>{if(e.isPrimary)start={x:e.clientX,y:e.clientY,id:e.pointerId};});b.addEventListener('pointerup',e=>{if(!start||e.pointerId!==start.id)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));});b.addEventListener('pointercancel',()=>{start=null});try{const state=JSON.parse(store.get(key)||'null');if(state&&Array.isArray(state.grid)&&state.grid.length===16&&state.grid.every(v=>Number.isSafeInteger(v)&&v>=0&&(v===0||(v&(v-1))===0))){grid=state.grid;score=Number(state.score)||0;won=!!state.won;over=!!state.over;best=Math.max(best,score);draw();notice('前回の続きから再開したよ')}else newGame(true)}catch{newGame(true)}})();
</script></body></html>
