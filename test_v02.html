<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#f7eee1"><title>おふポメ2048 Web v0.2 TEST</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#52382b;background:#f7eee1}*{box-sizing:border-box}html{min-height:100%}body{margin:0;min-height:100dvh;background:linear-gradient(#fff2,#fff2),url("assets/game_background.jpg") center center / cover fixed no-repeat}main{width:min(100%,720px);min-height:100dvh;margin:auto;padding:22px 14px 45px;display:flex;flex-direction:column;gap:14px}.top{display:grid;grid-template-columns:52px minmax(0,1fr) 52px;align-items:center;gap:6px}.top h1{text-align:center;font-size:clamp(25px,6.8vw,38px);line-height:1.2;margin:0;font-weight:900;color:#52382b;white-space:nowrap}.round-btn{border:0;border-radius:50%;background:#ffffffe0;width:52px;height:52px;color:#52382b;font-size:24px;cursor:pointer}.scores{display:flex;justify-content:center;gap:14px}.score{background:#ffffffa6;border-radius:12px;min-height:76px;width:min(40%,150px);text-align:center;padding:10px 5px;color:#73513d;font-size:13px;font-weight:700}.score b{display:block;font-size:27px;color:#52382b}.notice{min-height:20px;text-align:center;font-size:13px;color:#614534;font-weight:600}.board{--gap:clamp(5px,1.6vw,8px);--pad:clamp(6px,1.6vw,8px);position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:var(--gap);padding:var(--pad);width:100%;max-width:680px;aspect-ratio:1/1;align-self:center;border-radius:18px;background:#8c6b52a0;touch-action:none;user-select:none}.tile{min-width:0;min-height:0;border-radius:14px;background:#ffffff59;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:0;overflow:hidden;font-weight:900;color:#3b291f}.tile .number{font-size:clamp(17px,5.8vw,48px);line-height:1.05;letter-spacing:-.035em}.tile .paw{width:65%;max-height:55%;height:auto;fill:currentColor;opacity:.75}.tile[data-v="0"] .number,.tile[data-v="0"] .paw{display:none}.tile[data-v="2"]{background:#ffe6b8}.tile[data-v="4"]{background:#ffd194}.tile[data-v="8"]{background:#f5a15c}.tile[data-v="16"]{background:#f0854f}.tile[data-v="32"]{background:#e86b4d}.tile[data-v="64"]{background:#db5245}.tile[data-v="128"]{background:#f2b847}.tile[data-v="256"]{background:#f0a638}.tile[data-v="512"]{background:#ed912e}.tile[data-v="1024"]{background:#e87d26}.tile[data-v="2048"]{background:#e0661f}.tile[data-v="4096"],.tile[data-v="8192"]{background:#c74f29}.tile[data-v="1024"] .number,.tile[data-v="2048"] .number,.tile[data-v="4096"] .number,.tile[data-v="8192"] .number{font-size:clamp(14px,4.2vw,34px)}.tile[data-v="512"]:after,.tile[data-v="1024"]:after,.tile[data-v="2048"]:after,.tile[data-v="4096"]:after,.tile[data-v="8192"]:after{content:"✦";position:absolute;align-self:flex-end;margin-right:6px;margin-top:-30px;color:white;font-size:clamp(11px,2.4vw,20px)}.overlay{position:absolute;inset:var(--pad);z-index:5;border-radius:14px;background:#f7eee1ed;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;text-align:center;padding:16px}.overlay.show{display:flex}.overlay strong{font-size:28px}.buddy-area{display:flex;align-items:center;justify-content:center;gap:10px;max-width:680px;width:100%;align-self:center}.buddy-msg{flex:1;min-height:105px;display:flex;align-items:center;justify-content:center;background:#f5eddcEB;border:2px solid #8c6b5273;border-radius:16px;padding:12px;font-size:clamp(13px,3.4vw,18px);font-weight:700;line-height:1.55;text-align:center}.buddy{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:95px}.buddy img{width:clamp(75px,19vw,120px);height:clamp(75px,19vw,120px);object-fit:contain}.buddy strong{font-size:13px}.buddy small{font-size:11px;background:#ffffffc9;padding:2px 7px;border-radius:10px}.toolbar{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}button.action,.direction button,.overlay button{border:0;border-radius:10px;background:#a8876e;color:#fff;font-size:14px;font-weight:700;padding:12px 14px;cursor:pointer}.toolbar .secondary,.direction button{background:#d6c4b1;color:#554639}button:disabled{opacity:.5;cursor:default}.direction{display:grid;grid-template-columns:repeat(3,58px);gap:6px;justify-content:center}.direction button{min-height:45px;touch-action:manipulation}.direction .up{grid-column:2}.direction .left{grid-column:1}.direction .down{grid-column:2}.direction .right{grid-column:3}.help{background:#fff9efc9;padding:12px 16px;border-radius:12px;font-size:13px;line-height:1.7}.footer{text-align:center;font-size:11px;color:#73513d}.dialog{border:0;border-radius:16px;padding:22px;background:#fff8ed;color:#52382b;max-width:min(90vw,400px)}.dialog::backdrop{background:#0008}.dialog button{margin-top:12px} @media(max-width:380px){main{padding:14px 8px 30px;gap:9px}.top{grid-template-columns:42px minmax(0,1fr) 42px}.round-btn{width:42px;height:42px}.buddy{min-width:78px}.buddy-msg{min-height:85px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main><header class="top"><button class="round-btn" id="home" aria-label="ホーム">⌂</button><h1>おふポメ2048</h1><button class="round-btn" id="settings" aria-label="設定">⚙</button></header><div class="scores"><div class="score">SCORE<b id="score">0</b></div><div class="score">BEST<b id="best">0</b></div></div><div class="notice" id="notice" aria-live="polite"></div><div id="board" class="board" aria-label="2048の盤面"></div><div class="buddy-area"><div class="buddy-msg">相棒をタップすると、離れた同じ数字を1回だけ合成できます<br>（能力は準備中）</div><div class="buddy"><img src="assets/ofupome_01.png" alt="おふポメ"><strong>おふポメ</strong><small>準備中</small></div></div><div class="toolbar"><button class="action" id="new">新しいゲーム</button><button class="action secondary" id="undo">1手戻す</button><button class="action secondary" id="sound">音 OFF</button></div><div id="direction" class="direction"><button class="up" data-dir="up" aria-label="上">↑</button><button class="left" data-dir="left" aria-label="左">←</button><button class="down" data-dir="down" aria-label="下">↓</button><button class="right" data-dir="right" aria-label="右">→</button></div><div class="help"><b>あそびかた</b><div>同じ数字を重ねて2048を目指そう！ スワイプ・方向ボタン・PCの矢印キーで操作できるよ。</div><div>このテスト版の進行状況は正式版と別に保存されるよ。</div></div><div class="footer">Web Ver.0.2 テスト版（STEP 16：外観実装／アニメーションは次段階）</div></main><dialog id="settingsDialog" class="dialog"><strong>設定</strong><p>新しいゲーム・1手戻す・音の切り替えは盤面の下のボタンから操作できます。</p><button class="action" id="closeSettings">閉じる</button></dialog><script>
(()=>{'use strict';const key='ofupome2048-web-v02-test',bestKey='ofupome2048-web-v02-test-best';const $=id=>document.getElementById(id);let grid=Array(16).fill(0),score=0,best=0,previous=null,won=false,achieved=false,over=false,sound=false,audio=null;const store={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};best=Number(store.get(bestKey))||0;function save(){store.set(key,JSON.stringify({grid,score,won,achieved,over}));store.set(bestKey,String(best))}function random(){const empty=grid.map((v,i)=>v?null:i).filter(v=>v!==null);if(!empty.length)return false;grid[empty[Math.floor(Math.random()*empty.length)]]=Math.random()<.9?2:4;return true}function notice(s){$('notice').textContent=s}function draw(){const b=$('board');b.innerHTML='';grid.forEach(v=>{const d=document.createElement('div');d.className='tile';d.dataset.v=String(v);if(v){const n=document.createElement('span');n.className='number';n.textContent=v;const paw=document.createElementNS('http://www.w3.org/2000/svg','svg');paw.setAttribute('class','paw');paw.setAttribute('viewBox','0 0 100 100');paw.setAttribute('aria-hidden','true');paw.innerHTML='<ellipse cx="19" cy="36" rx="10" ry="14" transform="rotate(-20 19 36)"/><ellipse cx="42" cy="22" rx="10" ry="14"/><ellipse cx="66" cy="24" rx="10" ry="14"/><ellipse cx="84" cy="40" rx="9" ry="13" transform="rotate(20 84 40)"/><path d="M50 45 C39 44 34 58 25 68 C17 79 24 91 37 87 C45 84 46 81 50 81 C54 81 60 88 70 87 C82 86 84 76 76 66 C68 56 63 45 50 45Z"/>';d.append(n,paw)}b.appendChild(d)});$('score').textContent=score;$('best').textContent=best;$('undo').disabled=!previous;let overlay;if(over||won){overlay=document.createElement('div');overlay.className='overlay show';const title=document.createElement('strong');title.textContent=over?'ゲームオーバー':'2048達成！';const btn=document.createElement('button');btn.textContent=over?'もう一度':'このまま続ける';btn.onclick=()=>{if(over)newGame(true);else{won=false;save();draw()}};overlay.append(title,btn);b.appendChild(overlay)}}function beep(){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=420;g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.08);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.08)}catch{}}function hasMove(){if(grid.includes(0))return true;for(let r=0;r<4;r++)for(let c=0;c<4;c++){const i=r*4+c;if(c<3&&grid[i]===grid[i+1]||r<3&&grid[i]===grid[i+4])return true}return false}function move(dir){if(over||won)return;const before=grid.slice(),oldScore=score;let merged=0;for(let line=0;line<4;line++){const indices=[];for(let k=0;k<4;k++){let r,c;if(dir==='left'){r=line;c=k}else if(dir==='right'){r=line;c=3-k}else if(dir==='up'){r=k;c=line}else{r=3-k;c=line}indices.push(r*4+c)}const vals=indices.map(i=>grid[i]).filter(Boolean),out=[];for(let i=0;i<vals.length;i++){if(i+1<vals.length&&vals[i]===vals[i+1]){const v=vals[i]*2;out.push(v);score+=v;merged++;i++}else out.push(vals[i])}indices.forEach((idx,k)=>grid[idx]=out[k]||0)}if(before.every((v,i)=>v===grid[i]))return;previous={grid:before,score:oldScore,won,achieved,over};random();if(score>best)best=score;if(grid.some(v=>v>=2048)&&!achieved){achieved=true;won=true;notice('やったね！ 2048達成！')}else notice(merged?`${merged}組を合成！`:'');over=!hasMove();beep();save();draw()}function newGame(confirmed=false){if(!confirmed&&grid.some(Boolean)&&!confirm('現在のゲームを最初からやり直す？'))return;grid=Array(16).fill(0);score=0;previous=null;won=false;achieved=false;over=false;random();random();notice('ゆっくり、いこう。');save();draw()}$('home').onclick=()=>{notice('ホーム画面は今後のバージョンで対応予定だよ')};$('settings').onclick=()=>{$('settingsDialog').showModal()};$('closeSettings').onclick=()=>{$('settingsDialog').close()};$('new').onclick=()=>newGame();$('undo').onclick=()=>{if(!previous)return;({grid,score,won,achieved,over}=previous);previous=null;notice('1手戻したよ');save();draw()};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'音 ON':'音 OFF';beep()};document.querySelectorAll('[data-dir]').forEach(btn=>{btn.addEventListener('click',()=>move(btn.dataset.dir));});window.addEventListener('keydown',e=>{const d={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];if(d){e.preventDefault();move(d)}});let start=null;const b=$('board');b.addEventListener('pointerdown',e=>{if(e.isPrimary)start={x:e.clientX,y:e.clientY,id:e.pointerId};});b.addEventListener('pointerup',e=>{if(!start||e.pointerId!==start.id)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));});b.addEventListener('pointercancel',()=>{start=null});try{const state=JSON.parse(store.get(key)||'null');if(state&&Array.isArray(state.grid)&&state.grid.length===16&&state.grid.every(v=>Number.isSafeInteger(v)&&v>=0&&(v===0||(v&(v-1))===0))){grid=state.grid;score=Number(state.score)||0;won=!!state.won;achieved=typeof state.achieved==='boolean'?state.achieved:(won||grid.some(v=>v>=2048));over=!!state.over;best=Math.max(best,score);draw();notice('前回の続きから再開したよ')}else newGame(true)}catch{newGame(true)}})();
</script></body></html>
